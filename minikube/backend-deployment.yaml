apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: backend 
  labels: 
    service: backend 
spec:
  replicas: 2
  selector:
    matchLabels:
      service: backend 
  template:
    metadata:
      labels: 
        service: backend 
    spec:
      containers:
      - name: backend
        env:
          - name: OTEL_SERVICE_NAME
            value: names-app
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector.monitoring.svc.cluster.local:4317
          - name: OTEL_TRACES_EXPORTER
            value: otlp
          - name: OTEL_LOGS_EXPORTER
            value: otlp
          - name: OTEL_METRICS_EXPORTER
            value: none
          - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
            value: "true"
        ports:
        - containerPort: 5001
        image: ghcr.io/dnatalyaalex/python-k8s-app-backend:1.1
        imagePullPolicy: "Always"
        volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data 
          persistentVolumeClaim:
            claimName: names-app-volume-pvc

