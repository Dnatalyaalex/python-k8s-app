apiVersion: v1 
kind: ConfigMap 
metadata:
  name: nginx-html 
data:
  index.html: |
    <html>
      <body><h1>Hello from NGINX service!</h1></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels: 
      service: nginx 
  template:
    metadata:
      labels:
        service: nginx
    spec:
      containers:
        - name: nginx 
          image: nginx:alpine 
          volumeMounts: 
            - name: html 
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: nginx-html 
---
apiVersion: v1 
kind: Service 
metadata:
  name: nginx-service 
spec:
  selector: 
    service: nginx
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP 