apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels: 
      service: nginx 
  template:
    metadata:
      labels:
        service: nginx
    spec:
      containers:
        - name: nginx 
          image: ghcr.io/dnatalyaalex/python-k8s-app-nginx:1.0
          ports:
          - containerPort: 80
---
apiVersion: v1 
kind: Service 
metadata:
  name: nginx-service 
spec:
  selector: 
    service: nginx
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP 