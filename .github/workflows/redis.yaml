name: Redis Image Build
on:
  push:
    tags:
      - 'redis-v*'

permissions:
  contents: read
  packages: write 

jobs:
  redis-image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#redis-v}" >> "$GITHUB_OUTPUT"
      - name: Login 
        uses: docker/login-action@v4 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: checkout
        uses: actions/checkout@v4

      - name: setup
        uses: docker/setup-buildx-action@v4

      - name: build
        uses: docker/build-push-action@v7
        with: 
          push: true
          tags: ghcr.io/dnatalyaalex/python-k8s-app-redis:${{ steps.version.outputs.version }}
          context: ./redis