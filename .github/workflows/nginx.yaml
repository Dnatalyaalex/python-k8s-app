name: Nginx Image build 
on:
  push:
    tags:
      - 'nginx-v*'

permissions:
  contents: read
  packages: write

jobs:
  image-build:
    runs-on: ubuntu:24.04 
    steps:
      - name: Get Version
        id: version 
        run: echo "version==${GITHUB_REF_NAME#nginx-v}" >> "$GITHUB_OUTPUT"
      - name: Login
        uses: docker/login-action@v4 
        with: 
          registry: ghcr.io 
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: checkout 
        uses: action/checkout@v4 

      - name: setup 
        uses: docker/setup-buildx-action@v7
        with: 
          push: true
          tags: ghcr.io/dnatalyaalex/python-k8s-app-nginx:${{ steps.version.outputs.version }}
          context: ./aws/nginx