name: YAML Validation 
on:
  push:
    branches:
      - 'main'
    paths:
      - '**.yaml'
jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - uses: khiemdoan/yaml-linting-action@v1
        name: lint-yaml
        with:
          files: 
            - '**.yaml'