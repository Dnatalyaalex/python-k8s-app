name: YAML Validation 
on:
  push:
    branches:
      - 'main'
    paths:
      - '**.yaml'
# on:
#   schedule:
#     - cron: '*/1 * * * *'
jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: install linter
        run: |
          sudo apt update
          sudo apt install -y yamllint 
      - name: run linter
        run: |
          yamllint .