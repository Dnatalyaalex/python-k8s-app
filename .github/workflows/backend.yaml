name: image_build
on:
  push:
    tags: 
      - 'backend-v*'
    paths:
      - './backend/**'

jobs:
  build:
    name: image-build
    runs-on: ubuntu-slim
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"
      - name: login
        uses: docker/login-action@v4
        with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: checkout
        uses: actions/checkout@v4

      - name: setup
        uses: docker/setup-buildx-action@v4

      - name: build
        uses: docker/build-push-action@v7
        with: 
          push: true
          tags: dnatalyaalex/python-k8s-app-backend:${{ steps.version.outputs.version }}
          context: ./backend




