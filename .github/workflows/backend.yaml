name: Backend Image Build
on:
  push:
    tags: 
      - 'backend-v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: image build
    runs-on: ubuntu-latest
    steps:
      - name: get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"
      - name: login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: checkout
        uses: actions/checkout@v4

      - name: setup
        uses: docker/setup-buildx-action@v4

      - name: build
        uses: docker/build-push-action@v7
        with: 
          push: true
          tags: ghcr.io/dnatalyaalex/python-k8s-app-backend:${{ steps.version.outputs.version }}
          context: ./backend




